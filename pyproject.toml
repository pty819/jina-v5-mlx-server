[project]
name = "jina-v5-mlx-server"
version = "0.2.0"
description = "Local Jina v5 embedding and v3 reranker serving with MLX on Apple Silicon"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "huggingface-hub[hf_xet]",
    "mlx",
    "mlx-lm",
    "numpy",
    "safetensors",
    "tokenizers",
    "uvicorn[standard]",
]

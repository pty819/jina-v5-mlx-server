[project]
name = "jina-v5-mlx-server"
version = "0.2.0"
description = "Local Jina v5 embedding, Prism rerank, and MLX chat gateway serving on Apple Silicon"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "httpx",
    "huggingface-hub[hf_xet]",
    "mlx",
    "mlx-embeddings>=0.1.0",
    "mlx-lm",
    "safetensors",
    "tokenizers",
    "uvicorn[standard]",
]
